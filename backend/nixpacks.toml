[phases.setup]
nixPkgs = ["postgresql", "python312"]

[phases.build]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"

[variables]
PORT = "8000"

[healthcheck]
path = "/health"
interval = "10s"
timeout = "5s"
retries = 3
