name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://forge:forge@localhost:5432/forge_agent_test
      REDIS_URL: redis://localhost:6379/0
      DEFAULT_PROVIDER: opencode-go
      GITHUB_TOKEN: test-token
      GITHUB_OWNER: test-owner
      GITHUB_WEBHOOK_SECRET: test-secret
      VERCEL_TOKEN: test-token
      VERCEL_WEBHOOK_SECRET: test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t forge-backend ./backend

      - name: Build frontend image
        run: docker build -t forge-frontend ./frontend
